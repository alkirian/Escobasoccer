<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Escoba Voladora — fútbol de magos en escobas</title>
  <meta name="description" content="Deporte mágico 1v1 y 2v2: magos colgados de escobas físicas pelean por meter la pelota en el portal rival. Golpes cargados, dashes, orbes y explosiones de gol. Gratis, en tu navegador.">
  <meta name="theme-color" content="#0a0c18">
  <!-- Vista previa al compartir el link. og:image necesita URL absoluta:
       cuando el juego tenga dominio, agregá
       <meta property="og:image" content="https://TU-DOMINIO/captura.jpg"> -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Escoba Voladora">
  <meta property="og:description" content="Fútbol de magos en escobas voladoras: física alocada, golpes cargados y explosiones de gol. Jugá gratis en el navegador.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧹</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0c18; --panel: #141830; --panel2: #1b2040; --line: #2a3157;
      --text: #e8ecff; --muted: #8a93be; --accent: #ffd54a;
    }
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(ellipse at 20% 15%, rgba(63,192,255,.07) 0%, transparent 45%),
        radial-gradient(ellipse at 80% 80%, rgba(255,138,60,.05) 0%, transparent 45%),
        radial-gradient(ellipse at 50% -20%, #1a2145 0%, var(--bg) 62%);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 8px; overflow: hidden;
      padding: 24px;
    }
    /* Estrellitas flotando (CSS puro, sin canvas) */
    .star {
      position: fixed; border-radius: 50%; background: #9fd8ff;
      pointer-events: none; opacity: .5;
      animation: drift linear infinite;
    }
    @keyframes drift {
      0%   { transform: translateY(0) scale(1); opacity: .1; }
      50%  { opacity: .6; }
      100% { transform: translateY(-48px) scale(.6); opacity: 0; }
    }

    .logo {
      font: 700 clamp(38px, 7vw, 64px) Georgia, serif;
      letter-spacing: .02em; text-align: center;
      text-shadow: 0 0 34px rgba(63,192,255,.35);
      margin-bottom: 2px;
    }
    .logo .escoba { display: inline-block; animation: fly 2.4s ease-in-out infinite; }
    @keyframes fly {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-9px) rotate(5deg); }
    }
    .logo span.v { color: var(--accent); }
    .tag { color: var(--muted); margin-bottom: 26px; text-align: center; }

    nav { display: flex; flex-direction: column; gap: 13px; width: min(370px, 88vw); }

    /* Botón del menú: gradiente en capas + borde degradado + barrido de luz.
       El borde degradado usa el truco de doble fondo (padding-box/border-box):
       el borde es "transparente" pero por detrás corre su propio gradiente. */
    nav a {
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 14px;
      border: 1px solid transparent; border-radius: 16px;
      background:
        linear-gradient(165deg, #1c2244 0%, #141830 55%, #10142a 100%) padding-box,
        linear-gradient(160deg, rgba(120,160,255,.45), rgba(60,80,140,.15) 40%, rgba(63,192,255,.3)) border-box;
      padding: 15px 22px;
      color: var(--text); text-decoration: none;
      font: 600 18px system-ui;
      box-shadow: 0 4px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    /* Barrido de luz que cruza el botón al pasar el mouse */
    nav a::after {
      content: ''; position: absolute; top: 0; bottom: 0;
      left: -70%; width: 45%;
      background: linear-gradient(100deg, transparent, rgba(190,220,255,.16), transparent);
      transform: skewX(-18deg);
      transition: left .45s ease;
      pointer-events: none;
    }
    nav a:hover::after { left: 125%; }
    nav a:hover {
      transform: translateY(-2px) scale(1.015);
      background:
        linear-gradient(165deg, #232a56 0%, #1a2040 55%, #151a34 100%) padding-box,
        linear-gradient(160deg, rgba(63,192,255,.85), rgba(90,120,200,.35) 45%, rgba(63,192,255,.6)) border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 24px rgba(63,192,255,.22),
                  inset 0 1px 0 rgba(255,255,255,.1);
    }
    nav a:active { transform: translateY(0) scale(.99); transition-duration: .06s; }
    nav a .ico { font-size: 22px; width: 30px; text-align: center;
      filter: drop-shadow(0 2px 6px rgba(63,192,255,.35)); }
    nav a small { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }

    /* JUGAR: oro fundido. Gradiente cálido, doble glow (cerca + lejos) que
       respira, y el mismo barrido de luz pero más intenso. */
    nav a.primary {
      background:
        linear-gradient(170deg, #ffe98a 0%, #ffd54a 38%, #ffb52e 78%, #f09a1a 100%) padding-box,
        linear-gradient(160deg, #fff3b8, #ffc93a 50%, #ff9d2e) border-box;
      color: #201700;
      font-size: 21px; padding: 18px 22px;
      text-shadow: 0 1px 0 rgba(255,255,255,.35);
      box-shadow: 0 6px 22px rgba(255,170,40,.35), 0 0 42px rgba(255,213,74,.28),
                  inset 0 1px 0 rgba(255,255,255,.55), inset 0 -8px 16px rgba(200,110,0,.28);
      animation: goldbreathe 2.6s ease-in-out infinite;
    }
    @keyframes goldbreathe {
      0%, 100% { box-shadow: 0 6px 22px rgba(255,170,40,.35), 0 0 42px rgba(255,213,74,.28),
                             inset 0 1px 0 rgba(255,255,255,.55), inset 0 -8px 16px rgba(200,110,0,.28); }
      50%      { box-shadow: 0 6px 26px rgba(255,170,40,.5), 0 0 60px rgba(255,213,74,.42),
                             inset 0 1px 0 rgba(255,255,255,.55), inset 0 -8px 16px rgba(200,110,0,.28); }
    }
    nav a.primary::after {
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
    }
    nav a.primary small { color: #7a5c08; }
    nav a.primary .ico { filter: drop-shadow(0 1px 3px rgba(160,90,0,.5)); }
    nav a.primary:hover {
      transform: translateY(-2px) scale(1.03);
      background:
        linear-gradient(170deg, #fff0a0 0%, #ffdd60 38%, #ffbe3c 78%, #f5a424 100%) padding-box,
        linear-gradient(160deg, #fff8d0, #ffd44e 50%, #ffab3a) border-box;
      box-shadow: 0 10px 30px rgba(255,170,40,.55), 0 0 70px rgba(255,213,74,.5),
                  inset 0 1px 0 rgba(255,255,255,.65), inset 0 -8px 16px rgba(200,110,0,.24);
      animation: none;
    }

    footer {
      position: fixed; bottom: 14px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 18px;
      color: #55608f; font-size: 12px;
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }

    /* Monedas: chip fijo arriba a la derecha, discreto pero siempre visible */
    #coinChip {
      position: fixed; top: 16px; right: 16px;
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--line);
      background: linear-gradient(165deg, #1c2244 0%, #141830 100%);
      color: var(--accent); font: 700 15px system-ui;
      box-shadow: 0 4px 14px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06);
    }
  </style>
  <script>
    // roundRect llegó a Safari 16 / Firefox 112 (lo usan las otras páginas
    // del juego; acá se define temprano por si se navega con caché tibia).
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        r = Math.min(Math.abs(Array.isArray(r) ? r[0] : (r || 0)), Math.abs(w) / 2, Math.abs(h) / 2);
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
      };
    }
  </script>
</head>
<body>
  <div id="coinChip"><span>🪙</span> <span id="coinCount">0</span></div>

  <h1 class="logo"><span class="escoba">🧹</span> Escoba <span class="v">Voladora</span></h1>
  <p class="tag" data-i18n="menu.tagline">Fútbol de magos. Física alocada. Cero reglas elegantes.</p>

  <nav>
    <a class="primary" href="modo.html"><span class="ico">▶</span> <span data-i18n="menu.play">JUGAR</span> <small data-i18n="menu.play.sub">1v1 · 2v2 · torneo</small></a>
    <a href="personajes.html"><span class="ico">🧙</span> <span data-i18n="menu.characters">Personajes</span> <small data-i18n="menu.characters.sub">héroes y paletas</small></a>
    <a href="trofeos.html"><span class="ico">🏆</span> <span data-i18n="menu.trophies">Trofeos</span> <small data-i18n="menu.trophies.sub">desafíos y récords</small></a>
    <a href="opciones.html"><span class="ico">⚙️</span> <span data-i18n="menu.settings">Opciones</span> <small data-i18n="menu.settings.sub">sonido y controles</small></a>
  </nav>

  <footer>
    <span>v1.1</span>
  </footer>

  <script type="module">
    import { applyI18n, t } from './src/i18n/i18n.js';
    import { BUILD_CONFIG } from './src/build_config.js';
    import { isFirstEver } from './src/stats.js';
    import { coins } from './src/roster.js';
    applyI18n();
    document.getElementById('coinCount').textContent = coins();

    // ── Modo portal (CrazyGames) ─────────────────────────────────────────
    // Antes del primer partido de la vida, el menú entero es ruido: un solo
    // botón PLAY que lleva directo al gameplay (main.js ya fuerza 90 s en
    // fácil para el primer partido — FIRST_EVER). Con el primer partido
    // jugado, isFirstEver() da false y el menú completo aparece solo.
    if (BUILD_CONFIG.portalMode && isFirstEver()) {
      document.querySelector('nav').style.display = 'none';
      const big = document.createElement('a');
      big.href = 'play.html?mode=1v1';
      big.id = 'quickplay';
      big.innerHTML = `<span class="qp-main">${t('menu.quickplay')}</span>` +
                      `<span class="qp-sub">${t('menu.quickplay.sub')}</span>`;
      document.querySelector('nav').before(big);
    }

    // ── Enlaces externos: fuera en el build de portal ────────────────────
    // CrazyGames no permite cross-promotion (GitHub, otras webs). El editor
    // de héroes tampoco viaja en el build del portal.
    if (!BUILD_CONFIG.externalLinks) {
      document.querySelectorAll('a[href^="http"], a[href="veditor.html"]')
        .forEach((a) => a.remove());
    }
  </script>
  <style>
    #quickplay {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 22px 64px; border-radius: 18px; text-decoration: none;
      background: linear-gradient(170deg, #ffe98a 0%, #ffd54a 45%, #ffb52e 100%);
      color: #201700; box-shadow: 0 6px 30px rgba(255,170,40,.45);
      transition: transform .15s;
    }
    #quickplay:hover { transform: translateY(-2px) scale(1.02); }
    #quickplay .qp-main { font: 800 30px Georgia, serif; letter-spacing: .04em; }
    #quickplay .qp-sub { font: 600 13px system-ui; opacity: .75; }
  </style>
  <script>
    // Estrellitas de fondo: livianas, sin canvas ni loop propio
    for (let i = 0; i < 26; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = 1 + Math.random() * 2.5;
      s.style.cssText = `left:${Math.random() * 100}vw; top:${Math.random() * 100}vh;` +
        `width:${size}px; height:${size}px;` +
        `animation-duration:${3 + Math.random() * 5}s;` +
        `animation-delay:${-Math.random() * 6}s;`;
      document.body.appendChild(s);
    }
    // PWA — solo en standalone. El build de portal (CrazyGames) no debe
    // registrar service worker ni cachear nada por su cuenta.
    import('./src/build_config.js').then(({ BUILD_CONFIG }) => {
      if (BUILD_CONFIG.pwa && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    });
  </script>
</body>
</html>
