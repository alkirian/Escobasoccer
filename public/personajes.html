<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escoba Voladora — Personajes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧹</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c18; --panel: #141830; --panel2: #1b2040; --line: #2a3157;
    --text: #e8ecff; --muted: #8a93be; --accent: #ffd54a;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -20%, #1a2145 0%, var(--bg) 60%);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100%;
    padding: clamp(12px, 2.2vh, 20px);
    display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.2vh, 12px);
  }
  h1 { font: 700 clamp(18px, 3vh, 26px) Georgia, serif; letter-spacing: .02em; text-align: center; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin-top: -4px; font-size: clamp(11px, 1.5vh, 13px); text-align: center; }

  /* ── Grilla ────────────────────────────────────────────────────────────
     Cards de tamaño fijo (no carrusel): llenan el ancho disponible y, si no
     entran, se apilan hacia abajo — la página scrollea, no la fila. */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px; width: 100%; max-width: 1100px;
  }

  /* Card cerrada: retrato + nombre + rol. Tamaño fijo, nunca cambia con el
     contenido — esto es justo lo que evita el bug de layout que había antes
     (las flechas de un carrusel viejo saltando de lugar al cambiar de
     personaje porque el contenedor entero respiraba con el contenido). */
  .card {
    position: relative;
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
    cursor: pointer; transition: border-color .15s, box-shadow .15s;
    aspect-ratio: 3 / 4; overflow: hidden;
    display: flex; flex-direction: column;
    text-decoration: none; color: var(--text);
  }
  .card:hover { border-color: #3d4780; }
  .card.on {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255,213,74,.35), 0 0 22px rgba(255,213,74,.45);
  }
  .card.locked { filter: grayscale(.65) brightness(.75); }
  .card.locked:hover { filter: grayscale(.35) brightness(.92); }

  /* Botón "Ver más": sólo aparece al hover, encima del peek, sin taparlo
     entero — el click en la CARD selecciona; el click en este botón navega
     al detalle. */
  .verMas {
    position: absolute; top: 8px; right: 8px; z-index: 3;
    font: 600 10.5px system-ui; padding: 5px 10px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.25); background: rgba(10,12,24,.72);
    color: var(--text); text-decoration: none;
    opacity: 0; pointer-events: none; transition: opacity .15s ease;
  }
  .card:hover .verMas { opacity: 1; pointer-events: auto; }
  .verMas:hover { background: rgba(20,24,48,.9); border-color: var(--accent); color: var(--accent); }

  .card canvas {
    width: 100%; flex: 1 1 auto; min-height: 0;
    background: linear-gradient(180deg, #10142c 0%, #171c38 100%);
  }
  .card .footer { flex: none; padding: 6px 8px 8px; text-align: center; }
  .nom { font: 700 clamp(12px, 1.6vw, 15px) Georgia, serif; line-height: 1.15; }
  .nom small { display: block; color: var(--muted); font: 400 10px system-ui; margin-top: 1px; }
  .card.locked .footer .nom::before { content: '🔒 '; }

  /* Mini-stats en hover: una franja delgada SIN tapar la card entera (a
     diferencia del panel de detalle completo, que ahora vive en su propia
     página). Aparece flotando sobre la parte de abajo del retrato. */
  .peek {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    background: linear-gradient(180deg, rgba(10,12,24,0) 0%, rgba(10,12,24,.94) 40%);
    padding: 18px 8px 6px;
    display: flex; flex-direction: column; gap: 2px;
    opacity: 0; pointer-events: none; transition: opacity .15s ease;
  }
  .card:hover .peek { opacity: 1; }
  .peek .strow { display: flex; align-items: center; gap: 4px; }
  .peek .strow .sn { font-size: 9px; width: 14px; text-align: center; }
  .peek .strow .pips { display: flex; gap: 1.5px; flex: 1; }
  .peek .strow .pip { flex: 1; height: 4px; border-radius: 1px; background: rgba(255,255,255,.12); }
  .peek .strow .pip.on { background: var(--c); }

  .actions { display: flex; gap: 10px; flex: none; padding-top: 4px; }
  .btn {
    font: 600 clamp(12px, 1.8vh, 14px) system-ui; padding: 8px 22px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    cursor: pointer; text-decoration: none; transition: .15s;
  }
  .btn:hover { border-color: #3d4780; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1400; }
  .btn.primary:hover { filter: brightness(1.08); }

  /* ── Página de detalle (misma pantalla, con ?ver=id) ─────────────────── */
  #detailView { display: none; width: 100%; max-width: 760px; flex-direction: column; gap: 14px; }
  #detailView.show { display: flex; }
  #gridView.hide { display: none; }

  .det-head { display: flex; gap: 16px; align-items: center; }
  .det-canvas-wrap {
    flex: none; width: clamp(150px, 26vw, 230px); aspect-ratio: 1 / 1;
    border-radius: 16px; overflow: hidden;
    background: linear-gradient(180deg, #10142c 0%, #171c38 100%);
    border: 1px solid var(--line);
  }
  .det-canvas-wrap canvas { width: 100%; height: 100%; }
  .det-id { flex: 1; }
  .det-id .nom { font: 700 clamp(22px, 4vh, 30px) Georgia, serif; }
  .det-id .nom small { display: block; color: var(--muted); font: 400 14px system-ui; margin-top: 2px; }
  .det-id .rol {
    display: inline-block; margin-top: 6px;
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 20px;
    padding: 3px 12px; color: var(--accent);
  }
  .det-id .arq { color: var(--accent); font-size: 13px; font-style: italic; margin-top: 8px; }

  .det-stats { display: flex; flex-direction: column; gap: 5px; }
  .det-stats .strow { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .det-stats .strow .sn { width: 76px; color: var(--muted); text-align: left; }
  .det-stats .strow .pips { display: flex; gap: 3px; flex: 1; }
  .det-stats .strow .pip { flex: 1; height: 8px; border-radius: 3px; background: #262c4e; }
  .det-stats .strow .pip.on { background: var(--c); }

  .det-pasiva {
    font-size: 12.5px; color: #cfe0ff;
    background: rgba(63,192,255,.08); border: 1px solid rgba(63,192,255,.25);
    border-radius: 10px; padding: 8px 12px;
  }
  .det-pasiva b { color: #ffd54a; }

  .det-section h2 {
    font: 700 clamp(13px, 1.9vh, 16px) Georgia, serif; color: var(--accent);
    margin-bottom: 6px;
  }
  .det-section p { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .det-tips { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .det-tips > div {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px;
  }
  .det-tips h3 {
    font: 700 12px system-ui; letter-spacing: .04em; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .det-tips .play h3 { color: #7ee8a2; }
  .det-tips .against h3 { color: #ff8a7c; }
  .det-tips p { font-size: 12.5px; color: var(--muted); line-height: 1.45; }

  .pal-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .pal {
    font: 600 11.5px system-ui; padding: 5px 12px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--muted);
    cursor: pointer; transition: .13s;
  }
  .pal:hover { color: var(--text); border-color: #3d4780; }
  .pal.on { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 560px) {
    .det-head { flex-direction: column; text-align: center; }
    .det-tips { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div id="gridView">
    <h1 data-i18n-html="chars.title">Elegí tu <span>personaje</span></h1>
    <p class="sub" data-i18n="chars.sub">Todos vuelan igual — lo que cambia es quién sos ahí arriba.</p>
    <div class="grid" id="grid"></div>
    <div class="actions">
      <a class="btn" href="index.html" id="btnMenu" data-i18n="chars.menu">← Menú</a>
      <a class="btn" href="veditor.html" data-i18n="chars.editor">Crear el mío (editor)</a>
      <button class="btn primary" id="btnPlay" data-i18n="chars.play">Jugar →</button>
    </div>
  </div>

  <div id="detailView">
    <a class="btn" href="#" id="btnBack" data-i18n="detail.back">← Todos los personajes</a>
    <div class="det-head">
      <div class="det-canvas-wrap"><canvas id="detCanvas" width="400" height="400"></canvas></div>
      <div class="det-id">
        <div class="nom" id="detNom"></div>
        <span class="rol" id="detRol"></span>
        <div class="arq" id="detArq"></div>
      </div>
    </div>
    <div class="det-stats" id="detStats"></div>
    <div class="det-pasiva" id="detPasiva" style="display:none"></div>
    <div class="det-section">
      <h2 data-i18n="detail.lore">Historia</h2>
      <p id="detLore"></p>
    </div>
    <div class="det-tips">
      <div class="play">
        <h3 data-i18n="detail.tips.play">Cómo jugarlo</h3>
        <p id="detTipsPlay"></p>
      </div>
      <div class="against">
        <h3 data-i18n="detail.tips.against">Cómo vencerlo</h3>
        <p id="detTipsAgainst"></p>
      </div>
    </div>
    <div class="pal-row" id="detPalRow"></div>
    <div class="actions">
      <button class="btn primary" id="detPlayBtn"></button>
    </div>
  </div>

  <script type="module">
    import { BUILD_CONFIG } from './src/build_config.js';
    if (!BUILD_CONFIG.externalLinks) {
      document.querySelectorAll('a[href="veditor.html"]').forEach((a) => a.remove());
    }
  </script>
  <script type="module" src="src/personajes.js"></script>
</body>
</html>
