<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escoba Voladora — Personajes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧹</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c18; --panel: #141830; --panel2: #1b2040; --line: #2a3157;
    --text: #e8ecff; --muted: #8a93be; --accent: #ffd54a;
  }
  body {
    background: radial-gradient(ellipse at 50% -20%, #1a2145 0%, var(--bg) 60%);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; padding: 26px 20px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  h1 { font: 700 30px Georgia, serif; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin-top: -12px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 250px));
    gap: 16px; justify-content: center; max-width: 1400px;
  }
  .card {
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
    padding: 12px 12px 14px; cursor: pointer; transition: .15s;
    display: flex; flex-direction: column; gap: 8px; text-align: center;
  }
  .card:hover { border-color: #3d4780; transform: translateY(-3px); }
  .card.on { border-color: var(--accent); box-shadow: 0 0 22px rgba(255,213,74,.18); }
  .card canvas {
    width: 100%; height: 210px; border-radius: 9px;
    background: linear-gradient(180deg, #10142c 0%, #171c38 100%);
  }
  .nom { font: 700 19px Georgia, serif; }
  .nom small { color: var(--muted); font: 400 13px/1 system-ui; }
  .rol {
    align-self: center; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 20px;
    padding: 3px 12px; color: var(--accent);
  }
  .bio { color: var(--muted); font-size: 12.5px; min-height: 54px; }
  .sel { font-size: 12px; color: var(--accent); font-weight: 600; visibility: hidden; }
  .card.on .sel { visibility: visible; }
  .actions { display: flex; gap: 12px; margin-top: 6px; }
  .btn {
    font: 600 15px system-ui; padding: 11px 30px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    cursor: pointer; text-decoration: none; transition: .15s;
  }
  .btn:hover { border-color: #3d4780; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1400; }
  .btn.primary:hover { filter: brightness(1.08); }

  /* Paletas alternativas (recompensas de desafíos) */
  .pal-row { display: flex; gap: 6px; justify-content: center; min-height: 26px; }
  .pal {
    font: 600 11px system-ui; padding: 4px 12px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--muted);
    cursor: pointer; transition: .13s;
  }
  .pal:hover { color: var(--text); border-color: #3d4780; }
  .pal.on { border-color: var(--accent); color: var(--accent); }

  /* Desafíos */
  .ch-wrap { max-width: 720px; width: 100%; }
  .ch-wrap h2 {
    font: 700 20px Georgia, serif; text-align: center; margin-bottom: 10px;
  }
  .ch {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 14px; margin-bottom: 6px; font-size: 13px;
  }
  .ch .ico { font-size: 20px; width: 28px; text-align: center; }
  .ch .tit { font-weight: 700; }
  .ch .des { color: var(--muted); font-size: 12px; }
  .ch .premio { margin-left: auto; font-size: 11.5px; color: var(--muted); text-align: right; }
  .ch.done { border-color: rgba(110,231,160,.5); }
  .ch.done .tit::after { content: ' ✓'; color: #6ee7a0; }
  .ch.done .premio { color: #6ee7a0; }
</style>
</head>
<body>
  <h1>Elegí tu <span>personaje</span></h1>
  <p class="sub">Todos vuelan igual — lo que cambia es quién sos ahí arriba.</p>
  <div class="grid" id="grid"></div>
  <div class="ch-wrap">
    <h2>🏅 Desafíos</h2>
    <div id="challenges"></div>
  </div>
  <div class="actions">
    <a class="btn" href="index.html">← Menú</a>
    <a class="btn" href="veditor.html">Crear el mío (editor)</a>
    <a class="btn primary" href="jugar.html">Jugar →</a>
  </div>
  <script type="module" src="src/personajes.js"></script>
</body>
</html>
