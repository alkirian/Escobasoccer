<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escoba Voladora — Personajes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧹</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c18; --panel: #141830; --panel2: #1b2040; --line: #2a3157;
    --text: #e8ecff; --muted: #8a93be; --accent: #ffd54a;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -20%, #1a2145 0%, var(--bg) 60%);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    /* Pantalla completa SIEMPRE: nada de scroll. Antes era `min-height:100vh`
       y con 10 personajes la página medía 2655 px contra 910 de ventana —
       1745 px de scroll, y creciendo con cada personaje nuevo. */
    height: 100%; overflow: hidden;
    padding: 18px 20px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  h1 { font: 700 clamp(20px, 3vh, 28px) Georgia, serif; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin-top: -6px; font-size: clamp(11px, 1.6vh, 14px); }

  /* ── Carrusel ───────────────────────────────────────────────────────────
     Una fila que se desliza en vez de una grilla que crece hacia abajo. El
     alto de la tarjeta sale de la altura disponible (vh), así entra en
     cualquier pantalla sin recortar. */
  .carousel { position: relative; width: 100%; flex: 1; min-height: 0; display: flex;
              align-items: center; gap: 10px; }
  .track-wrap { overflow: hidden; flex: 1; min-width: 0; height: 100%;
                display: flex; align-items: center; }
  .grid {
    display: flex; gap: 14px; height: 100%; align-items: stretch;
    transition: transform .34s cubic-bezier(.22,.61,.36,1);
    will-change: transform;
  }
  .arrow {
    flex: none; width: 44px; height: 76px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    font: 700 22px system-ui; cursor: pointer; transition: .15s;
  }
  .arrow:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .arrow:disabled { opacity: .28; cursor: default; }
  /* Puntos de posición */
  .dots { display: flex; gap: 6px; justify-content: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #2b3157; transition: .15s; }
  .dot.on { background: var(--accent); width: 20px; border-radius: 4px; }
  /* Bloqueados + pasivas */
  .card.locked { filter: grayscale(.75) brightness(.72); }
  .card.locked:hover { filter: grayscale(.4) brightness(.9); }
  .card .pasiva {
    font-size: 12px; color: #cfe0ff; margin: 7px 10px 0;
    background: rgba(63,192,255,.08); border: 1px solid rgba(63,192,255,.25);
    border-radius: 9px; padding: 6px 10px;
  }
  .card .pasiva b { color: #ffd54a; }
  .card .buy {
    display: block; margin: 10px auto 4px;
    font: 700 13px system-ui; padding: 8px 18px; border-radius: 999px;
    border: 1px solid transparent;
    background:
      linear-gradient(170deg, #ffe98a 0%, #ffd54a 45%, #ffb52e 100%) padding-box,
      linear-gradient(160deg, #fff3b8, #ff9d2e) border-box;
    color: #201700; cursor: pointer;
    box-shadow: 0 3px 12px rgba(255,170,40,.35);
  }
  .card .buy:disabled {
    background: linear-gradient(170deg, #3a3a4a, #262636) padding-box,
      linear-gradient(160deg, rgba(150,150,180,.3), rgba(80,80,110,.2)) border-box;
    color: #8a93be; cursor: not-allowed; box-shadow: none;
  }

  .card {
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
    padding: 10px 10px 12px; cursor: pointer; transition: border-color .15s, box-shadow .15s;
    display: flex; flex-direction: column; gap: 5px; text-align: center;
    /* Ancho fijo (el carrusel lo desplaza) y alto que llena la fila. */
    flex: none; width: 228px; height: 100%; overflow: hidden;
  }
  .card:hover { border-color: #3d4780; }
  .card.on { border-color: var(--accent); box-shadow: 0 0 22px rgba(255,213,74,.18); }
  /* El retrato es lo importante de la tarjeta: se le garantiza un mínimo y
     crece con el espacio que sobre. Sin el `min-height` el flex lo aplastaba
     a 0 px en pantallas bajas (medido en 1366x640: el resto del contenido
     sumaba 325 px de 396 y al canvas no le quedaba nada). */
  .card canvas {
    width: 100%; flex: 1 1 auto; min-height: 120px; border-radius: 9px;
    background: linear-gradient(180deg, #10142c 0%, #171c38 100%);
  }
  .nom { font: 700 clamp(15px, 2.2vh, 18px) Georgia, serif; }
  .nom small { color: var(--muted); font: 400 12px/1 system-ui; }
  .rol {
    align-self: center; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 20px;
    padding: 3px 12px; color: var(--accent);
  }
  /* Sin min-height: la tarjeta ya no puede crecer, y la bio se recorta con
     elipsis si no entra en vez de empujar el layout. */
  .bio {
    color: var(--muted); font-size: 12px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .sel { font-size: 12px; color: var(--accent); font-weight: 600; visibility: hidden; }
  .card.on .sel { visibility: visible; }
  .actions { display: flex; gap: 10px; }
  .btn {
    font: 600 clamp(12px, 1.8vh, 14px) system-ui; padding: 8px 22px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    cursor: pointer; text-decoration: none; transition: .15s;
  }
  .btn:hover { border-color: #3d4780; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1400; }
  .btn.primary:hover { filter: brightness(1.08); }

  /* Barras de stats */
  .stats { display: flex; flex-direction: column; gap: 3px; margin: 2px 0; }
  .strow { display: flex; align-items: center; gap: 6px; font-size: 10.5px; }
  .strow .sn { width: 62px; color: var(--muted); text-align: left; }
  .strow .pips { display: flex; gap: 2px; flex: 1; }
  .strow .pip {
    flex: 1; height: 6px; border-radius: 2px; background: #262c4e;
  }
  .strow .pip.on { background: var(--c); }

  /* Paletas alternativas (recompensas de desafíos) */
  .pal-row { display: flex; gap: 6px; justify-content: center; min-height: 26px; }
  .pal {
    font: 600 11px system-ui; padding: 4px 12px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--muted);
    cursor: pointer; transition: .13s;
  }
  .pal:hover { color: var(--text); border-color: #3d4780; }
  .pal.on { border-color: var(--accent); color: var(--accent); }

  /* Desafíos: en una tira horizontal compacta al pie, no en una lista
     apilada que empujaba la página varias pantallas hacia abajo. */
  .ch-wrap { width: 100%; max-width: 1180px; }
  .ch-wrap h2 {
    font: 700 clamp(13px, 1.9vh, 16px) Georgia, serif; text-align: center; margin-bottom: 5px;
  }
  .ch-row {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 3px;
    scrollbar-width: thin;
  }
  .ch {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 11px; font-size: 12px; flex: none;
  }
  .ch .ico { font-size: 17px; width: 22px; text-align: center; }
  .ch .tit { font-weight: 700; white-space: nowrap; }
  .ch .des { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .ch .premio { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .ch.done { border-color: rgba(110,231,160,.5); }
  .ch.done .tit::after { content: ' ✓'; color: #6ee7a0; }
  .ch.done .premio { color: #6ee7a0; }

  /* ── Pantallas bajas ────────────────────────────────────────────────────
     Con poco alto no entra todo. En vez de dejar que aparezca el scroll (o
     que el retrato se aplaste a nada), se recorta lo secundario por orden de
     importancia: primero la tira de desafíos, después la pasiva y las barras
     de stats. El personaje y su nombre nunca se sacan. */
  @media (max-height: 780px) {
    .card .pasiva { display: none; }
    .bio { -webkit-line-clamp: 2; }
  }
  @media (max-height: 680px) {
    .ch-wrap { display: none; }
    .stats { display: none; }
    .sub { display: none; }
  }
  @media (max-height: 560px) {
    .bio { display: none; }
    .rol { display: none; }
  }
</style>
</head>
<body>
  <h1>Elegí tu <span>personaje</span></h1>
  <p class="sub">Todos vuelan igual — lo que cambia es quién sos ahí arriba.</p>
  <div class="carousel">
    <button class="arrow" id="prev" aria-label="Anterior">‹</button>
    <div class="track-wrap"><div class="grid" id="grid"></div></div>
    <button class="arrow" id="next" aria-label="Siguiente">›</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="ch-wrap">
    <h2>🏅 Desafíos</h2>
    <div class="ch-row" id="challenges"></div>
  </div>
  <div class="actions">
    <a class="btn" href="index.html">← Menú</a>
    <a class="btn" href="veditor.html">Crear el mío (editor)</a>
    <a class="btn primary" href="jugar.html">Jugar →</a>
  </div>
  <script type="module" src="src/personajes.js"></script>
</body>
</html>
