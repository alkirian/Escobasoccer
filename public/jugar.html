<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escoba Voladora — Preparar partido</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧹</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  :root {
    --bg: #0a0c18; --panel: #141830; --panel2: #1b2040; --line: #2a3157;
    --text: #e8ecff; --muted: #8a93be; --accent: #ffd54a;
  }
  body {
    background: radial-gradient(ellipse at 50% -20%, #1a2145 0%, var(--bg) 60%);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    /* Pantalla completa, sin scroll nunca (medido: en 1280x640 desbordaba
       244 px). El contenido se comprime en vez de crecer. */
    height: 100%; overflow: hidden;
    padding: 14px 16px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 9px;
  }
  h1 { font: 700 24px Georgia, serif; }
  h1 span { color: var(--accent); }

  /* Pestañas de modo: pastillas con gradiente; la activa es oro fundido */
  .tabs { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; }
  .tab {
    font: 600 15px system-ui; padding: 10px 24px; border-radius: 999px;
    border: 1px solid transparent;
    background:
      linear-gradient(170deg, #1b2142 0%, #141830 100%) padding-box,
      linear-gradient(160deg, rgba(120,160,255,.4), rgba(60,80,140,.12)) border-box;
    color: var(--muted); cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05);
    transition: transform .15s ease, box-shadow .15s ease, color .15s ease, background .15s ease;
  }
  .tab:hover {
    color: var(--text); transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(0,0,0,.4), 0 0 16px rgba(63,192,255,.18),
                inset 0 1px 0 rgba(255,255,255,.08);
  }
  .tab.on {
    background:
      linear-gradient(170deg, #ffe98a 0%, #ffd54a 45%, #ffb52e 100%) padding-box,
      linear-gradient(160deg, #fff3b8, #ff9d2e) border-box;
    color: #201700; text-shadow: 0 1px 0 rgba(255,255,255,.35);
    box-shadow: 0 4px 16px rgba(255,170,40,.4), 0 0 26px rgba(255,213,74,.3),
                inset 0 1px 0 rgba(255,255,255,.5);
  }

  /* Héroe */
  .hero-box { display: flex; align-items: center; gap: 10px;
              flex: 1 1 auto; min-height: 0; }
  .arrow {
    font-size: 26px; width: 52px; height: 52px; line-height: 1;
    display: grid; place-items: center;
    border: 1px solid transparent; border-radius: 50%;
    background:
      linear-gradient(170deg, #1c2244 0%, #141830 100%) padding-box,
      linear-gradient(160deg, rgba(120,160,255,.4), rgba(60,80,140,.12)) border-box;
    color: var(--muted); cursor: pointer; user-select: none;
    box-shadow: 0 3px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    transition: transform .14s ease, box-shadow .14s ease, color .14s;
  }
  .arrow:hover {
    color: var(--accent); transform: scale(1.12);
    box-shadow: 0 6px 18px rgba(0,0,0,.45), 0 0 18px rgba(255,213,74,.25),
                inset 0 1px 0 rgba(255,255,255,.1);
  }
  .arrow:active { transform: scale(.96); transition-duration: .06s; }
  .hero-card { text-align: center; display: flex; flex-direction: column;
               height: 100%; justify-content: center; }
  #heroCanvas {
    /* Alto flexible: el retrato usa lo que sobre, con un mínimo para que en
       pantallas bajas no se aplaste a nada. */
    width: min(400px, 78vw); height: auto; flex: 1 1 auto;
    min-height: 130px; max-height: 250px; border-radius: 16px;
    border: 1px solid transparent;
    background:
      linear-gradient(180deg, #10142c 0%, #171c38 100%) padding-box,
      linear-gradient(160deg, rgba(120,160,255,.4), rgba(60,80,140,.12) 45%, rgba(63,192,255,.28)) border-box;
    box-shadow: 0 6px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .hero-nom { font: 700 21px Georgia, serif; margin-top: 6px; }
  .hero-nom small { color: var(--muted); font: 400 13px system-ui; }
  .hero-rol {
    display: inline-block; font-size: 10.5px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--accent);
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 20px; padding: 2px 11px; margin-top: 3px;
  }
  /* Barras de stats */
  .stats { display: flex; flex-direction: column; gap: 4px; margin: 9px auto 2px;
           width: min(320px, 78vw); }
  .strow { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .strow .sn { width: 74px; color: var(--muted); text-align: left; }
  .strow .pips { display: flex; gap: 3px; flex: 1; }
  .strow .pip { flex: 1; height: 8px; border-radius: 3px; background: #262c4e; }
  .strow .pip.on { background: var(--c); }
  .arq { color: var(--accent); font-size: 12px; font-style: italic; margin-top: 5px; }

  .pal-row { display: flex; gap: 6px; justify-content: center; margin-top: 7px; min-height: 24px; }
  .pal {
    font: 600 11px system-ui; padding: 4px 12px; border-radius: 999px;
    border: 1px solid transparent;
    background:
      linear-gradient(170deg, #222950 0%, #1b2040 100%) padding-box,
      linear-gradient(160deg, rgba(120,160,255,.28), rgba(60,80,140,.1)) border-box;
    color: var(--muted); cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    transition: transform .13s ease, box-shadow .13s, color .13s, background .13s;
  }
  .pal:hover { color: var(--text); transform: translateY(-1px); }
  .pal.on {
    background:
      linear-gradient(170deg, #2c2540 0%, #221c34 100%) padding-box,
      linear-gradient(160deg, rgba(255,220,110,.8), rgba(255,170,50,.35)) border-box;
    color: var(--accent);
    box-shadow: 0 2px 10px rgba(0,0,0,.3), 0 0 14px rgba(255,213,74,.2);
  }

  /* Reglas: tarjetas con gradiente, borde degradado y filo de luz arriba */
  .rules { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .rule-card {
    position: relative; overflow: hidden;
    border: 1px solid transparent; border-radius: 16px;
    background:
      linear-gradient(165deg, #1c2244 0%, #141830 60%, #10142a 100%) padding-box,
      linear-gradient(160deg, rgba(120,160,255,.35), rgba(60,80,140,.12) 45%, rgba(63,192,255,.22)) border-box;
    padding: 13px 18px 15px; min-width: 210px; cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease, background .16s ease;
  }
  .rule-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 9px 26px rgba(0,0,0,.45), 0 0 20px rgba(63,192,255,.16),
                inset 0 1px 0 rgba(255,255,255,.09);
  }
  .rule-card h3 { font: 700 13px system-ui; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 9px; transition: color .16s; }
  .rule-card.on {
    background:
      linear-gradient(165deg, #241f38 0%, #1a1830 60%, #141226 100%) padding-box,
      linear-gradient(160deg, rgba(255,220,110,.85), rgba(255,170,50,.3) 50%, rgba(255,213,74,.6)) border-box;
    box-shadow: 0 4px 18px rgba(0,0,0,.4), 0 0 26px rgba(255,213,74,.2),
                inset 0 1px 0 rgba(255,255,255,.08);
  }
  .rule-card.on h3 { color: var(--accent); text-shadow: 0 0 12px rgba(255,213,74,.4); }
  .rule-card.off { opacity: .42; }

  /* Chips: mini pastillas; la activa hereda el oro de las pestañas */
  .chips { display: flex; gap: 7px; justify-content: center; }
  .chip {
    font: 600 13px system-ui; padding: 6px 15px; border-radius: 999px;
    border: 1px solid transparent;
    background:
      linear-gradient(170deg, #222950 0%, #1b2040 100%) padding-box,
      linear-gradient(160deg, rgba(120,160,255,.3), rgba(60,80,140,.1)) border-box;
    color: var(--muted); cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.05);
    transition: transform .13s ease, box-shadow .13s ease, color .13s, background .13s;
  }
  .chip:hover { color: var(--text); transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0,0,0,.35), 0 0 12px rgba(63,192,255,.15); }
  .chip.on {
    background:
      linear-gradient(170deg, #ffe98a 0%, #ffd54a 45%, #ffb52e 100%) padding-box,
      linear-gradient(160deg, #fff3b8, #ff9d2e) border-box;
    color: #201700; text-shadow: 0 1px 0 rgba(255,255,255,.3);
    box-shadow: 0 3px 12px rgba(255,170,40,.35), 0 0 18px rgba(255,213,74,.25),
                inset 0 1px 0 rgba(255,255,255,.5);
  }

  .rival { display: flex; align-items: center; gap: 10px; }
  .rival b { font: 700 13px system-ui; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

  /* Bracket del torneo */
  #bracket { display: none; flex-direction: column; gap: 6px; width: min(440px, 90vw); }
  .ronda {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 13px; font-size: 13px;
  }
  .ronda.done { border-color: rgba(110,231,160,.5); }
  .ronda.actual { border-color: var(--accent); background: #232a52; }
  .ronda .st { width: 24px; text-align: center; font-size: 15px; }
  .ronda .quien { font-weight: 700; }
  .ronda .det { color: var(--muted); font-size: 11.5px; }
  .ronda .regla { margin-left: auto; color: var(--muted); font-size: 11px; text-align: right; }
  .t-head { display: flex; justify-content: space-between; align-items: baseline; }
  .t-head b { color: var(--accent); font: 700 14px Georgia, serif; }
  .t-head button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 7px; padding: 3px 10px; font-size: 11px; cursor: pointer;
  }
  .t-head button:hover { color: #ff7a8c; border-color: #ff7a8c; }

  /* Botón principal: oro fundido con barrido de luz y glow que respira */
  .go {
    position: relative; overflow: hidden;
    font: 700 22px Georgia, serif; letter-spacing: .04em;
    border: 1px solid transparent; border-radius: 18px;
    background:
      linear-gradient(170deg, #ffe98a 0%, #ffd54a 38%, #ffb52e 78%, #f09a1a 100%) padding-box,
      linear-gradient(160deg, #fff3b8, #ffc93a 50%, #ff9d2e) border-box;
    color: #201700; text-shadow: 0 1px 0 rgba(255,255,255,.35);
    padding: 17px 62px; cursor: pointer; margin-top: 4px;
    box-shadow: 0 6px 22px rgba(255,170,40,.35), 0 0 42px rgba(255,213,74,.28),
                inset 0 1px 0 rgba(255,255,255,.55), inset 0 -8px 16px rgba(200,110,0,.28);
    animation: gobreathe 2.6s ease-in-out infinite;
    transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
  }
  @keyframes gobreathe {
    0%, 100% { box-shadow: 0 6px 22px rgba(255,170,40,.35), 0 0 42px rgba(255,213,74,.28),
                           inset 0 1px 0 rgba(255,255,255,.55), inset 0 -8px 16px rgba(200,110,0,.28); }
    50%      { box-shadow: 0 6px 26px rgba(255,170,40,.5), 0 0 62px rgba(255,213,74,.42),
                           inset 0 1px 0 rgba(255,255,255,.55), inset 0 -8px 16px rgba(200,110,0,.28); }
  }
  .go::after {
    content: ''; position: absolute; top: 0; bottom: 0;
    left: -70%; width: 45%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
    transform: skewX(-18deg); transition: left .45s ease; pointer-events: none;
  }
  .go:hover::after { left: 130%; }
  .go:hover {
    transform: translateY(-2px) scale(1.03); animation: none;
    background:
      linear-gradient(170deg, #fff0a0 0%, #ffdd60 38%, #ffbe3c 78%, #f5a424 100%) padding-box,
      linear-gradient(160deg, #fff8d0, #ffd44e 50%, #ffab3a) border-box;
    box-shadow: 0 10px 30px rgba(255,170,40,.55), 0 0 72px rgba(255,213,74,.5),
                inset 0 1px 0 rgba(255,255,255,.65), inset 0 -8px 16px rgba(200,110,0,.24);
  }
  .go:active { transform: translateY(0) scale(.99); transition-duration: .06s; }

  /* Candado de personaje bloqueado */
  .hide { display: none !important; }
  .lockrow {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    justify-content: center;
    font: 600 13.5px system-ui; color: #ffd54a;
    background: linear-gradient(170deg, rgba(50,40,20,.6), rgba(30,24,12,.7));
    border: 1px solid rgba(255,213,74,.35); border-radius: 999px;
    padding: 8px 18px;
  }
  .unlock {
    font: 700 13px system-ui; padding: 7px 16px; border-radius: 999px;
    border: 1px solid transparent;
    background:
      linear-gradient(170deg, #ffe98a 0%, #ffd54a 45%, #ffb52e 100%) padding-box,
      linear-gradient(160deg, #fff3b8, #ff9d2e) border-box;
    color: #201700; cursor: pointer;
    box-shadow: 0 3px 12px rgba(255,170,40,.35);
    transition: transform .14s ease, box-shadow .14s ease;
  }
  .unlock:hover:not(:disabled) { transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(255,170,40,.5); }
  .unlock:disabled {
    background: linear-gradient(170deg, #3a3a4a, #262636) padding-box,
      linear-gradient(160deg, rgba(150,150,180,.3), rgba(80,80,110,.2)) border-box;
    color: #8a93be; cursor: not-allowed; box-shadow: none;
  }
  .go:disabled {
    filter: grayscale(.9) brightness(.55); cursor: not-allowed;
    animation: none; transform: none;
  }

  .volver { color: var(--muted); text-decoration: none; font-size: 13px; margin-top: 2px; }
  .volver:hover { color: var(--text); }

  /* ── Pantallas bajas: recortar lo secundario antes que permitir scroll ── */
  @media (max-height: 760px) {
    .hero-nom { font-size: 18px; margin-top: 3px; }
    body { gap: 7px; }
  }
  @media (max-height: 660px) {
    .stats { display: none; }
    .hero-rol { display: none; }
  }
  @media (max-height: 560px) {
    .rival { display: none; }
  }
</style>
</head>
<body>
  <h1>Preparar <span>partido</span></h1>

  <div class="tabs" id="tabs"></div>

  <div class="hero-box">
    <button class="arrow" id="prevHero">‹</button>
    <div class="hero-card">
      <canvas id="heroCanvas" width="500" height="310"></canvas>
      <div class="hero-nom" id="heroNom"></div>
      <div><span class="hero-rol" id="heroRol"></span></div>
      <div id="heroStats"></div>
      <div class="arq" id="heroArq"></div>
      <div class="pal-row" id="palRow"></div>
    </div>
    <button class="arrow" id="nextHero">›</button>
  </div>

  <div class="rules" id="rules">
    <div class="rule-card" id="cardTiempo">
      <h3>⏱ Por tiempo</h3>
      <div class="chips" id="chipsTiempo"></div>
    </div>
    <div class="rule-card" id="cardGoles">
      <h3>🥅 Por goles</h3>
      <div class="chips" id="chipsGoles"></div>
    </div>
  </div>

  <div class="rival" id="rivalRow">
    <b>Rival</b>
    <div class="chips" id="chipsRival"></div>
  </div>

  <div id="bracket"></div>

  <!-- Personaje bloqueado: precio, saldo y compra -->
  <div class="lockrow hide" id="lockRow">
    <span id="lockTxt"></span>
    <button class="unlock" id="btnUnlock"></button>
  </div>

  <button class="go" id="btnGo">▶ ¡A VOLAR!</button>
  <a class="volver" href="index.html">← Volver al menú</a>

  <script type="module" src="src/jugar.js"></script>
</body>
</html>
