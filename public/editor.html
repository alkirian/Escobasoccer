<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broomball Blitz — Editor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧹</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #0a0c18;
    --panel:   #141830;
    --panel2:  #1b2040;
    --line:    #2a3157;
    --text:    #e8ecff;
    --muted:   #8a93be;
    --accent:  #ffd54a;
    --ok:      #6ee7a0;
    --bad:     #ff7a8c;
  }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; overflow: hidden;
    display: grid; grid-template-columns: 1fr 340px;
  }

  /* ── Escenario ── */
  .stage-wrap { position: relative; display: flex; flex-direction: column; }
  #stage { flex: 1; width: 100%; display: block; cursor: crosshair; }

  .stage-top {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 12px 16px;
    background: linear-gradient(180deg, rgba(10,12,24,0.92), transparent);
  }
  .stage-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    padding: 12px 16px;
    background: linear-gradient(0deg, rgba(10,12,24,0.92), transparent);
    font-size: 12px; color: var(--muted);
  }

  .pose {
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 12px; font-size: 12px; cursor: pointer;
    transition: .12s;
  }
  .pose:hover { color: var(--text); border-color: #3d4780; }
  .pose.on {
    background: var(--accent); color: #1a1400;
    border-color: var(--accent); font-weight: 600;
  }

  label.chk { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  input[type=checkbox] { accent-color: var(--accent); cursor: pointer; }
  input[type=range] { accent-color: var(--accent); cursor: pointer; }

  #manualRow { display: none; align-items: center; gap: 8px; }

  /* ── Panel derecho ── */
  .side {
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .side h1 {
    font-size: 15px; padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .side h1 small { font-size: 11px; color: var(--muted); font-weight: 400; }
  .scroll { flex: 1; overflow-y: auto; padding: 12px 14px 20px; }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: #2c3360; border-radius: 4px; }

  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 16px 0 8px;
    display: flex; align-items: baseline; gap: 6px;
  }
  h2:first-child { margin-top: 0; }
  h2 .h2sub { text-transform: none; letter-spacing: 0; font-size: 10px; color: #55608f; }

  /* Pestanas de seccion */
  .tabs {
    display: flex; gap: 4px; padding: 10px 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    flex: 1; background: none; border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted); font-size: 13px; font-family: inherit;
    padding: 8px 4px 9px; cursor: pointer; transition: .12s;
  }
  .tab:hover { color: var(--text); }
  .tab.on {
    color: var(--accent); border-bottom-color: var(--accent);
    font-weight: 600;
  }

  /* Lista de piezas */
  .piece {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: var(--panel2); border: 1px solid transparent;
    border-radius: 8px; padding: 7px 10px; margin-bottom: 5px;
    color: var(--text); font-size: 13px; text-align: left; cursor: pointer;
    transition: .12s;
  }
  .piece:hover { border-color: #3d4780; }
  .piece.on { border-color: var(--accent); background: #232a52; }
  .thumb {
    width: 30px; height: 30px; border-radius: 5px; flex: none;
    background-size: contain; background-repeat: no-repeat; background-position: center;
    background-color: #0e1226; border: 1px solid var(--line);
  }
  .thumb.empty::after {
    content: '+'; display: grid; place-items: center; height: 100%;
    color: #4a5488; font-size: 17px;
  }
  .pname { flex: 1; }
  .pstate { font-size: 10px; color: #5d6796; text-transform: uppercase; letter-spacing: .05em; }
  .pstate.ok { color: var(--ok); }

  /* Orden de capas */
  .layer {
    display: flex; align-items: center; gap: 6px; width: 100%;
    background: var(--panel2); border: 1px solid transparent;
    border-radius: 8px; padding: 5px 6px 5px 10px; margin-bottom: 4px;
    font-size: 12px; transition: .12s;
  }
  .layer.on { border-color: var(--accent); background: #232a52; }
  .layer .lname { flex: 1; cursor: pointer; color: var(--text); }
  .layer:hover .lname { color: var(--accent); }
  .layer button.mini { margin-left: 0; padding: 2px 7px; font-size: 12px; }

  /* Zona de carga */
  .drop {
    border: 2px dashed var(--line); border-radius: 10px;
    padding: 18px 12px; text-align: center; cursor: pointer;
    color: var(--muted); font-size: 12px; transition: .14s;
    background: #10142a;
  }
  .drop:hover, .drop.over {
    border-color: var(--accent); color: var(--text);
    background: #191f3d;
  }
  .drop b { display: block; color: var(--text); font-size: 13px; margin-bottom: 3px; }
  .hint { font-size: 11px; color: var(--muted); margin: 7px 2px 0; line-height: 1.4; }

  /* Sliders */
  .slider { margin-bottom: 9px; }
  .slider label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted); margin-bottom: 3px;
  }
  .slider label b { color: var(--text); font-variant-numeric: tabular-nums; }
  .slider input { width: 100%; }
  .checkrow {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-top: 10px; font-size: 12px;
  }
  .checkrow label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .muted { color: var(--muted); font-size: 12px; }

  /* Botones */
  button.act {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 8px 12px; font-size: 12px; cursor: pointer; transition: .12s;
  }
  button.act:hover { border-color: #3d4780; background: #232a52; }
  button.act.primary {
    background: var(--accent); color: #1a1400;
    border-color: var(--accent); font-weight: 600;
  }
  button.act.primary:hover { filter: brightness(1.08); }
  button.act.danger:hover { border-color: var(--bad); color: var(--bad); }
  button.mini {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer;
    margin-left: auto;
  }
  button.mini:hover { color: var(--text); border-color: #3d4780; }
  .btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
  .btnrow button { flex: 1; min-width: 0; }

  input.text {
    width: 100%; background: #0e1226; color: var(--text);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 8px 10px; font-size: 13px; font-family: inherit;
  }
  input.text:focus { outline: none; border-color: var(--accent); }

  /* Toast */
  .toast {
    position: fixed; bottom: 22px; left: 50%;
    transform: translate(-50%, 16px);
    background: var(--accent); color: #1a1400;
    padding: 9px 18px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: .22s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: var(--bad); color: #2a0008; }

  .guide {
    background: #10142a; border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px;
    font-size: 11px; color: var(--muted); line-height: 1.5;
  }
  .guide b { color: var(--text); }
  .guide code {
    background: #0a0c18; padding: 1px 4px; border-radius: 3px;
    font-size: 10px; color: var(--accent);
  }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
    .side { border-left: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>

<div class="stage-wrap">
  <canvas id="stage"></canvas>

  <div class="stage-top">
    <div id="poseRow" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <div id="manualRow">
      <span style="font-size:12px;color:var(--muted)">Ángulo</span>
      <input type="range" id="manualAngle" min="-3.14" max="3.14" step="0.01" value="0" style="width:130px">
    </div>
  </div>

  <div class="stage-bottom">
    <label class="chk"><input type="checkbox" id="toggleBones" checked> Huesos</label>
    <label class="chk"><input type="checkbox" id="toggleGeo" checked> Referencia</label>
    <span style="display:flex;align-items:center;gap:7px">
      Zoom <input type="range" id="zoom" min="0.5" max="3" step="0.05" value="1.6" style="width:110px">
    </span>
    <span id="stageInfo" style="margin-left:auto;font-variant-numeric:tabular-nums"></span>
  </div>
</div>

<aside class="side">
  <h1>
    Editor
    <small id="progress">0/9 piezas</small>
  </h1>

  <div class="tabs" id="sectionTabs"></div>

  <div class="scroll">
    <h2>Nombre</h2>
    <input class="text" id="skinName" value="Mi personaje" placeholder="Nombre del personaje">

    <h2>Partes del cuerpo</h2>
    <div id="pieceList"></div>

    <h2>Imagen de la pieza</h2>
    <div class="drop" id="dropZone">
      <b>Soltá un PNG acá</b>
      click para elegir · o pegá con Ctrl+V
    </div>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <p class="hint" id="pieceHint"></p>

    <h2>Ajustes</h2>
    <div id="tunePanel"></div>

    <h2>Orden de capas <small class="h2sub">adelante arriba</small></h2>
    <div id="layerList"></div>

    <h2>Cómo dibujar las piezas</h2>
    <div class="guide" id="guideBox"></div>

    <h2>Guardar</h2>
    <div class="btnrow" style="margin-bottom:6px">
      <button class="act primary" id="btnSave">Guardar</button>
      <button class="act" id="btnLoad">Cargar</button>
    </div>
    <div class="btnrow" style="margin-bottom:6px">
      <button class="act" id="btnExport">Exportar .json</button>
      <button class="act" id="btnImport">Importar</button>
    </div>
    <input type="file" id="importInput" accept=".json,application/json" hidden>
    <div class="btnrow">
      <button class="act danger" id="btnClearPiece">Borrar pieza</button>
      <button class="act danger" id="btnClearAll">Borrar todo</button>
    </div>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script type="module" src="src/editor.js"></script>
</body>
</html>
