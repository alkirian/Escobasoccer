name: Publicar en GitHub Pages

# El juego vive en public/, no en la raíz del repo. GitHub Pages solo puede
# servir directo desde "/" o "/docs" en un repo normal, así que en vez de
# mover carpetas se sube el CONTENIDO de public/ como artifact de Pages en
# cada push a main. El repo no cambia de forma; el sitio publicado sí sirve
# lo de adentro de public/ en la raíz del dominio.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
